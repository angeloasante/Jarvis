<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FRIDAY Browser Bridge</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; min-width: 320px; padding: 14px; margin: 0; }
    h1 { margin: 0 0 8px; font-size: 14px; }
    .status { padding: 8px 12px; border-radius: 8px; margin: 8px 0 12px; font-size: 13px; }
    .status.ok  { background: #def7ec; color: #03543f; }
    .status.bad { background: #fde8e8; color: #9b1c1c; }
    label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
    input, button { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
    button { background: #007aff; color: white; border-color: #007aff; cursor: pointer; margin-top: 8px; }
    button:hover { background: #0064d8; }
    .hint { font-size: 11px; color: #666; margin-top: 4px; line-height: 1.4; }
    .tabs-info { font-size: 11px; color: #666; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>FRIDAY Browser Bridge</h1>
  <div id="status" class="status">Loading…</div>

  <label for="token">Bridge token</label>
  <input id="token" type="password" placeholder="paste FRIDAY_BROWSER_EXT_TOKEN" />
  <p class="hint">From <code>~/Friday/.env</code> — auto-generated when FRIDAY first starts.</p>

  <button id="save">Save &amp; Connect</button>
  <button id="reconnect" style="background:#666;border-color:#666;">Reconnect</button>

  <script src="popup.js"></script>
</body>
</html>
